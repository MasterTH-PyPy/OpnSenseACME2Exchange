name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # Screenshots ins Repo zurückschreiben

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # für die Versionsnummer aus der Commit-Anzahl

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version bestimmen
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          "VERSION=1.0.$count" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version 1.0.$count"

      - name: Restore
        run: dotnet restore OpnSenseACME2Exchange.sln

      - name: Build
        run: dotnet build OpnSenseACME2Exchange.sln -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Tests
        run: dotnet run --project tests/OpnSenseACME2Exchange.Tests -c Release --no-build

      - name: Publish (self-contained, eine EXE)
        run: >
          dotnet publish src/OpnSenseACME2Exchange/OpnSenseACME2Exchange.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }} -o publish/self-contained

      - name: Publish (framework-dependent, braucht .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/OpnSenseACME2Exchange/OpnSenseACME2Exchange.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }} -o publish/framework-dependent

      - name: Screenshots erzeugen (Demodaten, kein Dienst)
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/framework-dependent/OpnSenseACME2Exchange.exe
          $out = Join-Path $PWD 'docs/screenshots'
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshots', "`"$out`"" -PassThru -Wait
          $err = Join-Path $out 'screenshot-error.txt'
          if (Test-Path $err) {
            $text = (Get-Content $err -Raw) -replace "`r?`n", ' | '
            Write-Host "::error title=Screenshot-Modus::$text"
            Remove-Item $err
          }
          if ($p.ExitCode -ne 0) { throw "Screenshot-Modus Exitcode $($p.ExitCode)" }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Screenshots ins Repo übernehmen
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          $changed = git status --porcelain -- docs/screenshots
          if ($changed) {
            git commit -m "Screenshots aktualisiert [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } else { Write-Host "Screenshots unverändert." }

      - uses: actions/upload-artifact@v4
        with:
          name: OpnSenseACME2Exchange-${{ env.VERSION }}-win-x64-selfcontained
          path: publish/self-contained/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpnSenseACME2Exchange-${{ env.VERSION }}-win-x64
          path: publish/framework-dependent/*.exe
